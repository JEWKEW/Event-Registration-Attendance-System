name: CI & Docker Build

on:
  workflow_call:
  pull_request:
    branches: [main, staging, sprint-2, sprint-3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Migrate, Seed & Test Backend (Prisma + Vitest)
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/events_test?schema=public
          DATABASE_URL_TEST: postgresql://app:app@localhost:5432/events_test?schema=public
          SESSION_SECRET: ci-test-session-secret-key-at-least-32-chars
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
          npm test

      - name: Build Backend & Frontend
        run: npm run build

      - name: Verify Unified Production Dockerfile Build
        run: |
          docker build -t sd74cc9ff:latest .
